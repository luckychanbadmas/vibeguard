version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibeguard-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://vibeguard:vibeguard_secure_pwd@postgres:5432/vibeguard?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=vibeguard-production-ultra-secret-32-chars-key
      - DEMO_MODE=true
      - SCAN_RATE_LIMIT_RPS=5
      - SCAN_MAX_REQUESTS=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: vibeguard-postgres
    restart: always
    environment:
      - POSTGRES_USER=vibeguard
      - POSTGRES_PASSWORD=vibeguard_secure_pwd
      - POSTGRES_DB=vibeguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vibeguard-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
